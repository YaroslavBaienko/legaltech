name: Update APT Repository

on:
  push:
    branches:
      - main
    tags:
      - 'v*'
  release:
    types: [ published ]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: "apt-repository"
  cancel-in-progress: false

jobs:
  apt-repository:
    name: Build & Publish APT Repository
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install APT Archiving & Packaging Tools
        run: |
          sudo apt-get update
          sudo apt-get install -y dpkg-dev apt-utils binutils lintian gnupg gzip

      - name: Install Typst (Static Binary)
        run: |
          mkdir -p "$HOME/.local/bin"
          curl -sSL "https://github.com/typst/typst/releases/download/v0.12.0/typst-x86_64-unknown-linux-musl.tar.xz" | tar -xJ -C /tmp
          mv /tmp/typst-*/typst "$HOME/.local/bin/typst"
          chmod +x "$HOME/.local/bin/typst"
          echo "$HOME/.local/bin" >> $GITHUB_PATH

      - name: Build qes-tools .deb
        working-directory: packages/qes-tools
        run: |
          npm ci || npm install --omit=dev
          ./build.sh

      # The marma-crypto-watermark .deb is built and signed locally (its SVG icon
      # carries a detached .p7s signature that requires the author's key) and then
      # committed. CI must publish that exact artifact, not rebuild it: a runner-side
      # rebuild produces an unsigned package with different bytes under the same
      # version string. Rebuild + commit the .deb locally on every version bump.
      - name: Verify canonical marma-crypto-watermark .deb
        run: |
          set -euo pipefail
          DEB="packages/marma-crypto-watermark/dist/marma-crypto-watermark_2.1.0-1_all.deb"
          test -f "$DEB"
          echo "canonical artifact: $DEB"
          md5sum "$DEB"
          test "$(md5sum "$DEB" | cut -d' ' -f1)" = "f17c86646d6e212f12828e5826e940fd"
          test "$(stat -c%s "$DEB")" = "88926"
          dpkg-deb -f "$DEB" Version | grep -qx "Version: 2.1.0-1"
          dpkg-deb -c "$DEB" | grep -q "marma-crypto-watermark.svg.p7s"
          echo "OK: canonical signed artifact verified"

      - name: Build and Sign APT Repository
        env:
          GPG_PRIVATE_KEY: ${{ secrets.GPG_PRIVATE_KEY }}
        run: |
          ./tools/build-apt-repo.sh "$RUNNER_TEMP/apt-repo"

      - name: Deploy to GitHub Pages (gh-pages)
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ${{ runner.temp }}/apt-repo
          publish_branch: gh-pages
          force_orphan: true
