name: Update APT Repository

on:
  push:
    tags:
      - 'v*'
  release:
    types: [ published ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  apt-repository:
    name: Build & Publish APT Repository
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install APT Archiving & Packaging Tools
        run: |
          sudo apt-get update
          sudo apt-get install -y dpkg-dev apt-utils binutils lintian gnupg gzip

      - name: Install Typst (Static Binary)
        run: |
          mkdir -p "$HOME/.local/bin"
          curl -sSL "https://github.com/typst/typst/releases/download/v0.12.0/typst-x86_64-unknown-linux-musl.tar.xz" | tar -xJ -C /tmp
          mv /tmp/typst-*/typst "$HOME/.local/bin/typst"
          chmod +x "$HOME/.local/bin/typst"
          echo "$HOME/.local/bin" >> $GITHUB_PATH

      - name: Build qes-tools .deb
        working-directory: packages/qes-tools
        run: |
          npm ci || npm install --omit=dev
          ./build.sh

      - name: Build and Sign APT Repository
        env:
          GPG_PRIVATE_KEY: ${{ secrets.GPG_PRIVATE_KEY }}
        run: |
          ./tools/build-apt-repo.sh "$RUNNER_TEMP/apt-repo"

      - name: Deploy to GitHub Pages (gh-pages)
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ${{ runner.temp }}/apt-repo
          publish_branch: gh-pages
          force_orphan: true
