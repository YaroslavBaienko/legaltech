name: Release Debian Packages

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  release-deb:
    name: Build & Publish Release .deb
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install Build Tools & Dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y dpkg-dev binutils lintian xz-utils

      - name: Install Typst (Static Binary)
        run: |
          mkdir -p "$HOME/.local/bin"
          curl -sSL "https://github.com/typst/typst/releases/download/v0.12.0/typst-x86_64-unknown-linux-musl.tar.xz" | tar -xJ -C /tmp
          mv /tmp/typst-*/typst "$HOME/.local/bin/typst"
          chmod +x "$HOME/.local/bin/typst"
          echo "$HOME/.local/bin" >> $GITHUB_PATH

      - name: Build qes-tools .deb
        working-directory: packages/qes-tools
        run: ./build.sh

      - name: Generate Checksums
        run: |
          mkdir -p dist
          cp packages/qes-tools/dist/*.deb dist/
          cd dist
          sha256sum *.deb > SHA256SUMS.txt
          cat SHA256SUMS.txt

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            dist/*.deb
            dist/SHA256SUMS.txt
          generate_release_notes: true
          draft: false
          prerelease: false
